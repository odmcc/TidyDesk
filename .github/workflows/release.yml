name: Release

# Push a tag like v3.1.0 to build TidyDesk.exe and publish it as a GitHub Release.
# Code signing is optional: it runs only when the SignPath settings below exist (see docs/SIGNING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read # SignPath reads the build artifact

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --nologo
      - run: powershell -ExecutionPolicy Bypass -File scripts\publish.ps1

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: TidyDesk-unsigned
          path: dist/TidyDesk.exe

      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: TidyDesk
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Pick the exe to release
        shell: pwsh
        run: |
          if (Test-Path signed\TidyDesk.exe) { Copy-Item signed\TidyDesk.exe release.exe } else { Copy-Item dist\TidyDesk.exe release.exe }
          Rename-Item release.exe TidyDesk.exe

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" TidyDesk.exe --title "TidyDesk ${{ github.ref_name }}" --generate-notes
